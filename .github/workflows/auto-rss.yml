name: Auto Generate RSS Feed

on:
  push:
    branches: [master]
    paths:
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate RSS
        run: npm run generate:rss

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          if git diff --cached --quiet; then
            echo "No changes to rss.xml"
          else
            git commit -m "Auto-generate rss.xml"
            git push
          fi
