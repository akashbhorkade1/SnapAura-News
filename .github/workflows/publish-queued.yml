name: Publish Queued Articles

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Publish up to three queued articles
        run: npm run publish:queued

      - name: Validate published site structure
        run: |
          npm run validate:seo
          npm run validate:links
          npm run validate:trust
          npm run validate:footer

      - name: Regenerate RSS and sitemap
        run: |
          npm run generate:rss
          npm run generate:sitemap

      - name: Commit published articles and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/queue.json rss.xml sitemap.xml
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No queued articles were due"
          else
            git commit -m "Publish queued articles"
            git push
          fi