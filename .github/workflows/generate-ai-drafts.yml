name: Generate Daily Article Drafts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate three drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: npm run generate:drafts
      - name: Check generated draft HTML
        run: node -e "const fs=require('fs'); const p='drafts/generated'; const files=fs.readdirSync(p).filter(f=>f.endsWith('.html')).sort((a,b)=>fs.statSync(p+'/'+b).mtimeMs-fs.statSync(p+'/'+a).mtimeMs).slice(0,3); if(files.length<3) throw new Error('Expected three generated drafts'); for(const f of files){const h=fs.readFileSync(p+'/'+f,'utf8'); for(const required of ['NewsArticle','datePublished','og:title','og:description','snap-source']) if(!h.includes(required)) throw new Error('Missing '+required+' in '+f)}"
      - name: Commit drafts for approval
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/generated
          if git diff --cached --quiet; then
            echo "No new drafts"
          else
            git commit -m "Generate daily article drafts"
            git push
          fi