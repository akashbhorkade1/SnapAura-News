name: Generate Daily Article Drafts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_API_Key }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is empty. Add a repository secret named GEMINI_API_KEY."
            exit 1
          fi
          echo "Gemini API key is available to the workflow."
      - name: Check Gemini model access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_API_Key }}
          GEMINI_MODEL: gemini-2.0-flash
        run: |
          status=$(curl --silent --show-error --output /tmp/gemini-model.json --write-out "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}?key=${GEMINI_API_KEY}")
          if [ "$status" != "200" ]; then
            echo "Gemini model check failed with HTTP $status:"
            cat /tmp/gemini-model.json
            exit 1
          fi
          echo "Gemini model ${GEMINI_MODEL} is available."
      - name: Generate three drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_API_Key }}
          GEMINI_MODEL: gemini-2.0-flash
        run: npm run generate:drafts
      - name: Check generated draft HTML
        run: |
          node -e "const fs=require('fs'); const p='drafts/generated'; const files=fs.readdirSync(p).filter(f=>f.endsWith('.html')).sort(); console.log('Generated drafts:', files); if(files.length<3) throw new Error('Expected three generated drafts, found '+files.length); for(const f of files.slice(-3)){const h=fs.readFileSync(p+'/'+f,'utf8'); for(const required of ['NewsArticle','datePublished','og:title','og:description','snap-source']) if(!h.includes(required)) throw new Error('Missing '+required+' in '+f)}"
      - name: Commit drafts for approval
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/generated
          if git diff --cached --quiet; then
            echo "No new drafts"
          else
            git commit -m "Generate daily article drafts"
            git push
          fi