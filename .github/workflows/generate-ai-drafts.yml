name: Generate and Publish Scheduled Articles

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - name: Check Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_API_Key }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is empty. Add a repository secret named GEMINI_API_KEY."
            exit 1
          fi
          echo "Gemini API key is available to the workflow."
      - name: Generate scheduled category articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.Gemini_API_Key }}
          GEMINI_MODEL: gemini-3.6-flash
        run: npm run generate:drafts
      - name: Check generated draft HTML
        run: |
          node -e "const fs=require('fs'); const p='drafts/generated'; const files=fs.readdirSync(p).filter(f=>f.endsWith('.html')).sort(); console.log('Generated drafts:', files); if(files.length<1) throw new Error('Expected at least one generated draft, found '+files.length); for(const f of files){const h=fs.readFileSync(p+'/'+f,'utf8'); for(const required of ['NewsArticle','datePublished','og:title','og:description']) if(!h.includes(required)) throw new Error('Missing '+required+' in '+f); const isCareer=/article:section[^>]*content="Career"/i.test(h); if(!isCareer && !h.includes('snap-source')) throw new Error('Missing snap-source in '+f)}"
      - name: Publish generated articles immediately
        run: npm run publish:queued
      - name: Validate published site structure
        run: |
          npm run validate:seo
          npm run validate:links
          npm run validate:trust
          npm run validate:footer
      - name: Regenerate RSS and sitemap
        run: |
          npm run generate:rss
          npm run generate:sitemap
      - name: Commit published articles and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/generated drafts/queue.json rss.xml sitemap.xml
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No new articles"
          else
            git commit -m "Publish scheduled articles"
            git push
          fi
